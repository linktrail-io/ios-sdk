appId: com.apple.mobilesafari
env:
  # Build mode for this flow: no clipboard auto-read, so iOS shows NO "Allow Paste" alert —
  # the app opens on the consent gate and the native Paste control is the consent.
  LINKTRAIL_TOKEN_SOURCE: pasteButton
---
# SUBDOMAIN (the LinkTrail-hosted host) × ALLOW (pasteButton) — full deferred flow, all in Maestro.
# ── Safari: type the subdomain link ($LINK_URL); the interstitial stages the real lt_click token ──
# (this host auto-redirects to the App Store — no "Continue" CTA — and stages the token on
#  page load, so the CTA tap and the "address is invalid" OK are optional.)
- stopApp
- launchApp
- tapOn: { id: "TabBarItemTitle" }
- inputText: ${LINK_URL}
- pressKey: Enter
- extendedWaitUntil: { visible: { text: "Continue to( the)? App Store" }, timeout: 20000, optional: true }
- tapOn: { text: "Continue to( the)? App Store", optional: true }
- tapOn: { text: "OK", optional: true }
- pressKey: Home
# ── App: opens on the consent gate; the native Paste control is the consent (no system alert). ──
- launchApp: { appId: io.linktrail.kickflipdemo, clearState: true }
- assertVisible: "Welcome to KickFlip"
- tapOn: { text: "^Paste$" }
# Last stop: the deferred link lands on the linked product with its voucher applied.
# EXPECT_VOUCHER_TEXT comes from the runner (scripts/e2e-env.json; the expect_voucher input overrides it).
- extendedWaitUntil: { visible: { text: "${EXPECT_VOUCHER_TEXT}" }, timeout: 20000, optional: false }

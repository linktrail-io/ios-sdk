appId: com.apple.mobilesafari
env:
  # Build mode for this flow: the SDK reads the clipboard itself, so iOS shows "Allow Paste".
  LINKTRAIL_TOKEN_SOURCE: automatic
---
# CUSTOM domain × ALLOW — full deferred flow, all in Maestro.
# ── Safari: the interstitial stages the real lt_click token on the clipboard ──
- stopApp
- launchApp
- tapOn: { id: "TabBarItemTitle" }
- inputText: ${LINK_URL}
- pressKey: Enter
- extendedWaitUntil: { visible: { text: "Continue to( the)? App Store" }, timeout: 20000 }
- tapOn: { text: "Continue to( the)? App Store" }
- tapOn: { text: "OK", optional: true }
- pressKey: Home
# ── App: fresh install reads the staged token; we ALLOW the paste. ──
- launchApp: { appId: io.linktrail.kickflipdemo, clearState: true }
# The SDK is deny-by-default: with no decision recorded it reads nothing and sends nothing,
# so the app asks first. Only after an answer does it touch the clipboard — which is what
# raises the iOS "Allow Paste" alert below.
- assertVisible: "Allow tracking?"
- tapOn: { id: "tracking-allow" }
- tapOn: { text: "^Allow Paste$" }
# The consent dialog is handled (dismissed). With a real backend key the token also routes to the
# linked product ("Opened from your link"); with the placeholder it's consumed but not counted.
# EXPECT_VOUCHER_TEXT comes from the runner (scripts/e2e-env.json; the expect_voucher input overrides it).
- extendedWaitUntil: { visible: { text: "${EXPECT_VOUCHER_TEXT}" }, timeout: 10000, optional: false }

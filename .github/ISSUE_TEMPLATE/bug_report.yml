name: Bug report
description: Report a problem with the LinkTrail iOS SDK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue — it genuinely helps.
        Please fill in the details below so we can reproduce and fix it quickly.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Which version of `LinkTrailSDK` are you on?
      placeholder: "0.0.8"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      description: How is the SDK integrated?
      options:
        - Swift Package Manager
        - CocoaPods
        - Manual (XCFramework)
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "iOS 17.5"
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device model
      placeholder: "iPhone 15 Pro · iPad Air · (or Simulator iPhone 15)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A deep link, code snippet, or minimal repro helps a lot.
      placeholder: |
        1. Configure the SDK with …
        2. Open link https://…
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant SDK logs
      description: |
        Enable logging with `LinkTrailOptions(logEnabled: true, logLevel: .debug)`, then copy the
        console output. In Xcode: the debug console; on a device: Console.app filtered by `LinkTrail`.
      render: shell
    validations:
      required: false

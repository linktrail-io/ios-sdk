name: E2E (published SDK)

# Deferred deep-link E2E against the PUBLISHED SDK: the KickFlip example in e2e/example/ depends on
# this repo's SPM release tag (exactVersion in e2e/example/project.yml, the one place to bump), so a
# run tests exactly what customers install, against the production backend. Maestro drives Safari and
# the app on a simulator; e2e/scripts/e2e-flows.json lists the flows, e2e/scripts/e2e-env.json the
# hosts and links (a link type with no link on prod is skipped with a notice). See e2e/README.md.
#
# GitHub-hosted runners only. This workflow never publishes anything: it only reads the repo and the
# tag. Publishing stays in publish.yml, which runs on podspec / framework changes to main.
#
# Layout: `setup` resolves the links and checks the secrets; `e2e` runs the rows as SHARDS parallel
# macOS jobs, each with its own simulator (e2e-maestro.sh SHARD_INDEX/SHARD_TOTAL: a deterministic,
# balanced split; the probabilistic rows all go to the last shard); `report` merges the shards'
# results into one report. Without the SDK key (fork pull requests) `build` only builds the example.
#
# SECRETS (repo Settings -> Secrets and variables -> Actions):
#   LINKTRAIL_KEY  SDK key of the prod e2e workspace. Without it (fork pull requests never get
#                  secrets) the flows are skipped with a notice; the example is still built against
#                  the published package, so a broken tag or interface still fails the run.
#   E2E_TOKEN      X-E2E-Token for the backend checks (install recorded, reward/earning, openCount,
#                  events). Without it the flows still run and those checks are recorded as skipped.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE'
  schedule:
    - cron: '0 3 * * *'   # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      link_types:
        description: 'Link types to run (all, none, or e.g. general,partner); default all'
        type: string
        required: false
        default: all
      flows:
        description: 'Optional: only these flows (space-separated names or unique substrings); empty = all'
        type: string
        required: false
        default: ''

# A new push to a PR cancels that PR's older run; schedule and manual runs are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}', github.event.pull_request.number) || format('e2e-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  # Maestro CLI version installed on the runners.
  MAESTRO_VERSION: '2.11.0'

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flows: ${{ steps.secrets.outputs.flows }}
      sdk_version: ${{ steps.targets.outputs.sdk_version }}
      env_name: ${{ steps.targets.outputs.e2e_env_name }}
      backend_url: ${{ steps.targets.outputs.backend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Which environment and links this run tests, from e2e/scripts/e2e-env.json. First, so a bad
      # input fails in seconds. Inputs reach the script as env vars, never pasted into the shell.
      - name: Resolve the e2e links
        id: targets
        env:
          E2E_LINK_TYPES: ${{ inputs.link_types || vars.E2E_LINK_TYPES }}
        run: |
          set -euo pipefail
          if ! out="$(python3 -I e2e/scripts/e2e-env.py resolve --format github --write "$RUNNER_TEMP/targets.json" 2>"$RUNNER_TEMP/e2e-env.err")"; then
            err="$(grep -m1 '^ERROR: ' "$RUNNER_TEMP/e2e-env.err" || cat "$RUNNER_TEMP/e2e-env.err")"
            echo "::error title=e2e targets::${err#ERROR: }"; exit 1
          fi
          printf '%s\n' "$out" | grep -E '^(e2e_env_name|backend_url)=' >> "$GITHUB_OUTPUT"
          skipped="$(printf '%s\n' "$out" | sed -n 's/^link_types_skipped=//p')"
          [ -z "$skipped" ] || echo "::notice title=e2e link types::skipped on prod (no link configured in e2e/scripts/e2e-env.json): $skipped"
          version="$(sed -n 's/^ *exactVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' e2e/example/project.yml | head -1)"
          [ -n "$version" ] || { echo "::error::no exactVersion for the LinkTrail package in e2e/example/project.yml"; exit 1; }
          echo "sdk_version=$version" >> "$GITHUB_OUTPUT"
          echo "Published SDK under test: $version"
          python3 -I -c 'import json,sys; t=json.load(open(sys.argv[1])); print("Environment: %s · backend: %s" % (t["environment"], t["backend"])); [print("  %-26s %s" % (k, v)) for k, v in t["links"].items()]' "$RUNNER_TEMP/targets.json"

      # Fork PRs get no secrets: say so once and run the build-only job instead of the flows.
      - name: Check secrets
        id: secrets
        env:
          HAS_KEY: ${{ secrets.LINKTRAIL_KEY != '' }}
          HAS_TOKEN: ${{ secrets.E2E_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "flows=true" >> "$GITHUB_OUTPUT"
          else
            echo "flows=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=e2e::LINKTRAIL_KEY is not available (fork pull request, or the secret is not set): the Maestro flows are skipped; the example is only built against the published SDK."
          fi
          if [ "$HAS_KEY" = "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning title=e2e::E2E_TOKEN is not set: the flows run, but every backend check is recorded as skipped."
          fi

  # No secret: build every mode against the published package with a placeholder-shaped key the build
  # check accepts. Nothing is installed or run, so the key is never sent anywhere.
  build:
    needs: setup
    if: needs.setup.outputs.flows != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && brew install xcodegen
      - name: Build the example against the published SDK (no flows)
        env:
          LINKTRAIL_KEY: lt_live_build_only_not_a_real_key
          E2E_BUILD_ONLY: '1'
        run: bash e2e/scripts/e2e-maestro.sh

  e2e:
    needs: setup
    if: needs.setup.outputs.flows == 'true'
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: macos-latest
    # ~10 rows of 2-5 min each plus ~10 min of setup and warm-up; every row's attempts stop after
    # ROW_BUDGET seconds and every maestro call after MAESTRO_TIMEOUT, so a shard cannot run away.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: '4'   # keep equal to the length of matrix.shard
    steps:
      # Booting takes minutes on a hosted runner: start it first, so it overlaps the installs and the
      # build. The runner waits for it to finish (simctl bootstatus) before the warm-up.
      - name: Start booting a simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | grep 'iPhone ' \
                 | grep -oiE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' | head -1)"
          [ -n "$UDID" ] || { echo "::error::no iPhone simulator available"; exit 1; }
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          echo "Booting $UDID"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen

      # Maestro needs Java 17+.
      - name: Java for Maestro
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: E2E — Maestro flows, shard ${{ matrix.shard }}/4 (published SDK ${{ needs.setup.outputs.sdk_version }})
        env:
          LINKTRAIL_KEY: ${{ secrets.LINKTRAIL_KEY }}
          E2E_TOKEN: ${{ secrets.E2E_TOKEN }}
          E2E_LINK_TYPES: ${{ inputs.link_types || vars.E2E_LINK_TYPES }}
          FLOWS: ${{ inputs.flows }}
          SHARD_INDEX: ${{ matrix.shard }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
          E2E_REPORT_DIR: ${{ runner.temp }}/e2e-report
        run: |
          set -euo pipefail
          # FLOWS is word-split on purpose (flow names have no spaces); empty runs them all.
          # shellcheck disable=SC2086
          DEVICE="$SIM_UDID" bash e2e/scripts/e2e-maestro.sh $FLOWS

      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e-report/results.jsonl
            ${{ runner.temp }}/e2e-report/plan.txt
            ${{ runner.temp }}/e2e-report/plan-all.txt
            ${{ runner.temp }}/e2e-report/targets.json
            ${{ runner.temp }}/e2e-report/screenshots/
          retention-days: 7
          if-no-files-found: warn

      - name: Shut the simulator down
        if: always()
        run: '[ -n "${SIM_UDID:-}" ] && xcrun simctl shutdown "$SIM_UDID" || true'

  # One report for the whole run, from every shard's results (written even when a shard failed or was
  # cancelled: rows that never ran show as "not run"). Nothing secret is in it: keys are removed and
  # click tokens cut to 4 characters.
  report:
    needs: [setup, e2e]
    if: always() && needs.setup.outputs.flows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the shards' results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: ${{ runner.temp }}/shards

      - name: Merge and render
        env:
          SHARDS: ${{ runner.temp }}/shards
          E2E_REPORT_DIR: ${{ runner.temp }}/e2e-report
          REPORT_ENV: ${{ needs.setup.outputs.env_name }}
          REPORT_BACKEND: ${{ needs.setup.outputs.backend_url }}
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          SDK_VERSION: ${{ needs.setup.outputs.sdk_version }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -uo pipefail
          mkdir -p "$E2E_REPORT_DIR/screenshots"
          : > "$E2E_REPORT_DIR/results.jsonl"
          for d in "$SHARDS"/e2e-shard-*; do
            [ -d "$d" ] || continue
            [ ! -f "$d/results.jsonl" ] || cat "$d/results.jsonl" >> "$E2E_REPORT_DIR/results.jsonl"
            [ -f "$E2E_REPORT_DIR/plan.txt" ] || [ ! -f "$d/plan-all.txt" ] || cp "$d/plan-all.txt" "$E2E_REPORT_DIR/plan.txt"
            [ -f "$E2E_REPORT_DIR/targets.json" ] || [ ! -f "$d/targets.json" ] || cp "$d/targets.json" "$E2E_REPORT_DIR/targets.json"
            [ ! -d "$d/screenshots" ] || cp "$d"/screenshots/* "$E2E_REPORT_DIR/screenshots/" 2>/dev/null || true
          done
          {
            echo "Published SDK under test: **$SDK_VERSION** (SPM tag) · shards: $E2E_RESULT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if python3 -I e2e/scripts/e2e-report.py render --dir "$E2E_REPORT_DIR" \
               --env "$REPORT_ENV" --backend "$REPORT_BACKEND" --commit "$REPORT_COMMIT" --runner "github-hosted (4 shards)" \
               --run-url "$REPORT_RUN_URL"; then
            cat "$E2E_REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "iOS SDK e2e: no results (the report could not be rendered; see the job log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            ${{ runner.temp }}/e2e-report/report.json
            ${{ runner.temp }}/e2e-report/report.html
            ${{ runner.temp }}/e2e-report/report.md
            ${{ runner.temp }}/e2e-report/screenshots/
          retention-days: 30
          if-no-files-found: warn

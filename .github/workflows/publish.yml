name: Publish

# Runs when a release PR (framework + bumped podspec) is merged into main. Publishes:
#   1. Swift Package Manager -> git tag <version>  (Package.swift is a path binaryTarget, so the
#      tag IS the SPM release).
#   2. CocoaPods             -> pod trunk push.
# Idempotent: tags/publishes only what's new.
#
# Runs on a GitHub-hosted macOS runner: this job only tags and pushes a pod — no simulator, no Xcode
# build, no local state — so it must NOT depend on the org self-hosted runner (which this repo has no
# access to; that is why every earlier Publish run sat queued and was cancelled).
#
# SECRET (this repo): COCOAPODS_TRUNK_TOKEN (from `pod trunk register`, ~/.netrc password).

on:
  push:
    branches: [main]
    paths:
      - 'LinkTrailSDK.podspec'
      - 'LinkTrailSDK.xcframework/**'
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write            # push the git tag with the default GITHUB_TOKEN

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need existing tags

      - name: Read podspec version
        id: ver
        run: |
          v="$(grep -E "s\.version[[:space:]]*=" LinkTrailSDK.podspec | head -1 | sed -E "s/.*'([^']+)'.*/\1/")"
          if [ -z "$v" ]; then echo "::error::Could not read s.version from LinkTrailSDK.podspec"; exit 1; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Tag the release (SPM)
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$V" >/dev/null 2>&1; then
            echo "::notice::Tag $V already exists — SPM release is already live."
          else
            git config user.name  "Ahsan Ali"
            git config user.email "iranaahsanali@gmail.com"
            git tag -a "$V" -m "LinkTrail iOS SDK $V"
            git push origin "$V"
            echo "::notice::Published SPM tag $V"
          fi

      - name: Publish to CocoaPods trunk
        env:
          V: ${{ steps.ver.outputs.v }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${COCOAPODS_TRUNK_TOKEN:-}" ]; then
            echo "::error::COCOAPODS_TRUNK_TOKEN not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          pod --version
          # Is LinkTrailSDK $V already published? Asks trunk's API and the CocoaPods/Specs repo directly
          # (the CDN and `pod trunk info` lag behind a push). Specs/2/3/2 = first 3 hex chars of md5("LinkTrailSDK").
          published() {
            curl -fsS -o /dev/null "https://trunk.cocoapods.org/api/v1/pods/LinkTrailSDK/versions/$V" 2>/dev/null && return 0
            curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/CocoaPods/Specs/contents/Specs/2/3/2/LinkTrailSDK/$V/LinkTrailSDK.podspec.json" 2>/dev/null
          }
          if published; then
            echo "::notice::CocoaPods LinkTrailSDK $V already published — skipping."
            exit 0
          fi
          if pod trunk push LinkTrailSDK.podspec --allow-warnings --skip-import-validation 2>&1 | tee push.log; then
            echo "::notice::Published CocoaPods pod LinkTrailSDK $V"
            exit 0
          fi
          # The push failed. Trunk can time out (or report a duplicate entry on a rerun) after it has already
          # committed the spec, so re-check for ~2 minutes before failing.
          if grep -q "Unable to accept duplicate entry" push.log; then
            echo "Trunk reports a duplicate entry for $V; checking that the spec exists."
          fi
          for _ in $(seq 1 12); do
            if published; then
              echo "::notice::pod trunk push failed, but LinkTrailSDK $V is published in CocoaPods/Specs — treating as success."
              exit 0
            fi
            sleep 10
          done
          echo "::error::pod trunk push failed and LinkTrailSDK $V is not in CocoaPods/Specs."
          exit 1
